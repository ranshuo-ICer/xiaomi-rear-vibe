<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root{--cam:30.33vw;--bar:8vh}
  /* 30.33vw = 296/976 = the rear camera zone; vw is density-proof */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'SF Mono',ui-monospace,Consolas,monospace}
  /* full-bleed backdrop covers everything, including under the cameras */
  body{background:
      radial-gradient(120% 90% at 75% 20%, #1e293b 0%, #0f172a 55%, #020617 100%)}
  body::after{content:'';position:fixed;inset:0;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);
      pointer-events:none}
  /* content lives right of the camera zone, clear of the switcher bar */
  .safe{position:fixed;top:0;right:0;bottom:var(--bar);left:var(--cam);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:#e2e8f0}
  #time{font-size:62px;font-weight:700;color:#facc15;line-height:1;
      text-shadow:0 0 42px rgba(250,204,21,.35);letter-spacing:1px}
  #time .c{animation:blink 1s steps(1) infinite;font-weight:300;opacity:.85}
  @keyframes blink{50%{opacity:.2}}
  #sec{font-size:13px;color:#f59e0b;letter-spacing:4px;margin-top:6px}
  #date{font-size:14px;color:#64748b;margin-top:12px;letter-spacing:2px}
  #dow{font-size:19px;color:#38bdf8;margin-top:6px;letter-spacing:6px}
  .tick{width:140px;height:3px;background:#1e293b;border-radius:3px;margin-top:14px;overflow:hidden}
  .tick i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#facc15);
      border-radius:3px;transition:width .3s linear}
</style>
</head>
<body>
<div class="safe">
  <div id="time">--<span class="c">:</span>--</div>
  <div id="sec">00 SECONDS</div>
  <div id="date">----</div>
  <div id="dow"></div>
  <div class="tick"><i id="bar" style="width:0%"></i></div>
</div>
<script>
const W=['日','一','二','三','四','五','六'];
const p=n=>String(n).padStart(2,'0');
function tick(){
  const d=new Date();
  document.getElementById('time').innerHTML=
    p(d.getHours())+'<span class="c">:</span>'+p(d.getMinutes());
  document.getElementById('sec').textContent=p(d.getSeconds())+' SECONDS';
  document.getElementById('date').textContent=
    d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate());
  document.getElementById('dow').textContent='星期'+W[d.getDay()];
  document.getElementById('bar').style.width=(d.getSeconds()/60*100)+'%';
}
tick();setInterval(tick,250);
</script>
</body>
</html>
