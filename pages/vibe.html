<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root{--cam:30.33vw;--bar:8vh}
  /* 30.33vw = 296/976 = the rear camera zone; vw is density-proof */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  body{background:#000}
  /* aurora blobs roam the FULL panel (background may cover the cameras) */
  .blob{position:absolute;width:420px;height:420px;border-radius:50%;
      filter:blur(70px);opacity:.6;animation:sw 10s ease-in-out infinite alternate}
  .b1{background:#7c3aed;left:-140px;top:-120px}
  .b2{background:#06b6d4;right:-160px;bottom:-140px;animation-delay:-5s}
  .b3{background:#ec4899;left:40%;bottom:-200px;width:320px;height:320px;animation-delay:-2s;opacity:.4}
  @keyframes sw{to{transform:translate(80px,60px) scale(1.3)}}
  /* text stays clear of the cameras and the switcher bar */
  .safe{position:fixed;top:0;right:0;bottom:var(--bar);left:var(--cam);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;z-index:2}
  h1{margin:0;font-size:50px;font-weight:900;letter-spacing:8px;
      background:linear-gradient(90deg,#c4b5fd,#67e8f9,#f0abfc);
      background-size:200% auto;animation:flow 6s linear infinite;
      -webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes flow{to{background-position:200% center}}
  p{margin:8px 0 0;color:#a5b4fc;font-size:12px;letter-spacing:4px}
  #motd{margin-top:14px;color:#e2e8f0;font-size:13px;min-height:22px;
      letter-spacing:1px;opacity:.9}
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="safe">
    <h1>VIBE</h1>
    <p>REAR SCREEN &middot; HTML MODE</p>
    <div id="motd"></div>
  </div>
<script>
const M=['code the vibe, not the plan','html is an app now',
 'the back screen is the main screen','ship first, polish vibes later',
 'one file, one function, one vibe','cameras left, vibes right'];
document.getElementById('motd').textContent=M[Math.floor(Date.now()/7000)%M.length];
</script>
</body>
</html>
